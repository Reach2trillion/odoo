<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — ABJ Shop</title>
<meta name="description" content="Contact ABJ Shop in Phnom Penh by Telegram, Messenger or phone. Open every day, 8:00 AM – 8:00 PM.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23c8607a'/><text x='50' y='68' font-size='46' font-family='Georgia' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="container">
      <p class="breadcrumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.contact"></span></p>
      <h1 data-i18n="contact.title"></h1>
      <p data-i18n="contact.lead"></p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container contact-grid">
      <div id="contactCards"></div>

      <div class="summary">
        <h2 data-i18n="contact.form.title"></h2>
        <form class="form-grid" id="contactForm">
          <div class="form-row">
            <div>
              <label class="lbl" for="cName" data-i18n="contact.form.name"></label>
              <input class="input" id="cName" required>
            </div>
            <div>
              <label class="lbl" for="cPhone" data-i18n="contact.form.contact"></label>
              <input class="input" id="cPhone" required>
            </div>
          </div>
          <div>
            <label class="lbl" for="cSubject" data-i18n="contact.form.subject"></label>
            <input class="input" id="cSubject">
          </div>
          <div>
            <label class="lbl" for="cMsg" data-i18n="contact.form.message"></label>
            <textarea class="textarea" id="cMsg" required></textarea>
          </div>
          <button class="btn btn--primary" type="submit" data-i18n="btn.send"></button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
function initContact() {
  const c = SHOP.contact;
  const cards = [
    [ICON.phone, t('contact.phone'), `<a href="tel:${c.phone.replace(/\s/g, '')}">${c.phone}</a> · <a href="${c.telegram}">Telegram</a>`],
    [ICON.pin, t('contact.shop'), tv(c.address)],
    [ICON.clock, t('contact.hours'), tv(c.hours)],
    [ICON.mail, t('contact.email'), `<a href="mailto:${c.email}">${c.email}</a>`],
    [ICON.chat, 'Messenger', `<a href="${c.messenger}">m.me/abjshop</a>`]
  ];
  document.getElementById('contactCards').innerHTML = cards.map(([icon, title, body]) => `
    <div class="contact-card">
      <span class="contact-card__icon">${icon}</span>
      <span><h3>${title}</h3><p>${body}</p></span>
    </div>`).join('');

  const form = document.getElementById('contactForm');
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = [
      `${t('contact.form.name')}: ${document.getElementById('cName').value}`,
      `${t('contact.form.contact')}: ${document.getElementById('cPhone').value}`,
      `${t('contact.form.subject')}: ${document.getElementById('cSubject').value}`,
      '',
      document.getElementById('cMsg').value
    ].join('\n');
    window.open(`${SHOP.contact.telegram}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    form.reset();
    toast(t('contact.form.sent'));
  };
}
boot('contact', initContact);
</script>
</body>
</html>
