services:
  facebook-auto-reply:
    build: .
    container_name: facebook-auto-reply
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Edit replies.json on the host to change the Khmer answers,
      # no rebuild needed (restart the container to be safe).
      - ./replies.json:/app/replies.json:ro
      - audio-cache:/data/audio
    restart: unless-stopped

  # Static ABJ storefront (website/). Nothing to build — nginx serves the files
  # directly, so edits to website/ show up on refresh.
  website:
    image: nginx:alpine
    container_name: abj-website
    ports:
      - "8080:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  audio-cache:
